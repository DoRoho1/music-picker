<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘은 뭘 들을까</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6ECF1; --surface: #F7F9FB; --ink: #1C2733; --muted: #5B6875;
  --line: #C9D3DC; --chip: #FFFFFF; --chip-on: #1C2733; --chip-on-ink: #F7F9FB;
  --label: #6A8CAF; --disc: #1A1A1D; --groove: #2C2C31; --heart: #D9466B;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121820; --surface: #1A222C; --ink: #E4EAF0; --muted: #9AA6B2;
    --line: #2E3A47; --chip: #222C37; --chip-on: #E4EAF0; --chip-on-ink: #121820;
    --disc: #050507; --groove: #1B1B20; --heart: #F06A8C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121820; --surface: #1A222C; --ink: #E4EAF0; --muted: #9AA6B2;
  --line: #2E3A47; --chip: #222C37; --chip-on: #E4EAF0; --chip-on-ink: #121820;
  --disc: #050507; --groove: #1B1B20; --heart: #F06A8C; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 1rem; line-height: 1.6; transition: background-color .6s ease;
}
main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.display {
  font-family: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight: 400;
}
h1 { font-size: clamp(2.3rem, 8vw, 3.5rem); line-height: 1.05; margin: 0 0 .5rem; }
.lede { color: var(--muted); margin: 0 0 1.5rem; }

nav.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
nav.tabs a {
  color: var(--muted); text-decoration: none; padding: .6rem .9rem; font-size: 1rem;
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs a:focus-visible { outline: 3px solid var(--label); outline-offset: 2px; }
.count { color: var(--heart); }

fieldset { border: 0; padding: 0; margin: 0 0 1.5rem; min-width: 0; }
legend { font-size: 1.05rem; margin-bottom: .6rem; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  font: inherit; font-size: .95rem; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 999px; padding: .45rem 1rem; cursor: pointer;
  transition: background-color .15s, color .15s, border-color .15s; min-height: 2.5rem;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--label); outline-offset: 2px; }

.go { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: .5rem; }
.btn {
  font: inherit; font-size: 1.05rem; border-radius: .6rem; padding: .7rem 1.4rem; cursor: pointer;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink); min-height: 2.75rem;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { font-size: .9rem; padding: .35rem .85rem; min-height: 2.25rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.hint { color: var(--muted); font-size: .9rem; }

.result { margin-top: 3rem; display: none; grid-template-columns: minmax(0, 12rem) 1fr; gap: 2rem; align-items: start; }
.result.show { display: grid; }
@media (max-width: 560px) {
  .result.show { grid-template-columns: 1fr; }
  .disc-wrap { width: 9.5rem; }
}
.disc-wrap { width: 100%; aspect-ratio: 1; }
.disc {
  width: 100%; height: 100%; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle, var(--label) 0 31%, var(--disc) 31.5% 33%, transparent 33%),
    repeating-radial-gradient(circle, var(--disc) 0 2px, var(--groove) 2px 3px);
  box-shadow: 0 1rem 2rem -1rem rgba(0,0,0,.45);
}
.disc::after { content: ""; position: absolute; inset: 47.5%; border-radius: 50%; background: var(--bg); }
.disc.spin { animation: spin 3.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .disc.spin { animation: none; } }

.situ { color: var(--muted); font-size: .95rem; margin: 0 0 .2rem; }
.genre-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin: 0 0 .6rem; }
.genre { font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.1; margin: 0; }
.like {
  font: inherit; font-size: .95rem; cursor: pointer; border-radius: 999px; padding: .35rem .9rem;
  background: transparent; color: var(--heart); border: 1px solid var(--heart); min-height: 2.25rem;
}
.like[aria-pressed="true"] { background: var(--heart); color: #fff; }
.like:focus-visible { outline: 3px solid var(--heart); outline-offset: 2px; }
.reason { font-size: 1.05rem; margin: 0 0 .4rem; }
.desc { color: var(--muted); margin: 0 0 1.25rem; max-width: 34rem; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
.picks { list-style: none; padding: 0; margin: 0 0 1.25rem; }
.picks li { padding: .45rem 0; border-bottom: 1px solid var(--line); }
.picks li:last-child { border-bottom: 0; }
.picks li { padding: 0; }
.song {
  font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: .75rem; width: 100%; padding: .55rem .25rem; border-radius: .4rem;
}
.song:hover { background: var(--surface); }
.song:focus-visible { outline: 3px solid var(--label); outline-offset: 1px; }
.play-icon {
  flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--label); color: #fff; font-size: .75rem;
}
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: center; gap: 1rem;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -.5rem 1.5rem -1rem rgba(0,0,0,.4);
}
.player-frame { flex: none; width: 10rem; aspect-ratio: 16 / 9; border-radius: .4rem; overflow: hidden; background: var(--disc); }
.player-frame:empty { display: none; }
.player-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.player-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
.player-info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-msg { color: var(--muted); font-size: .85rem; }
.player-msg:empty { display: none; }
.player-info a { color: var(--muted); font-size: .85rem; }
body.has-player main { padding-bottom: 10rem; }
@media (max-width: 480px) { .player-frame { width: 7.5rem; } }
.gem {
  display: inline-block; font-size: .75rem; color: var(--label); border: 1px solid var(--label);
  border-radius: 999px; padding: 0 .5rem; margin-left: .25rem; vertical-align: .1em; white-space: nowrap;
}
.search {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: .6rem;
  padding: .6rem .6rem .6rem 1rem; margin-bottom: 1rem;
}
.search span { flex: 1 1 12rem; }
.also { color: var(--muted); font-size: .92rem; margin: 0 0 1.25rem; }
.note { color: var(--muted); font-size: .82rem; margin-top: 1.5rem; }

.likes-list { list-style: none; padding: 0; margin: 0; }
.likes-list li {
  display: grid; grid-template-columns: 1rem 1fr auto; gap: .9rem; align-items: center;
  padding: 1rem 0; border-bottom: 1px solid var(--line);
}
.dot { width: 1rem; height: 1rem; border-radius: 50%; }
.likes-list .name { font-size: 1.25rem; display: block; line-height: 1.2; }
.likes-list .meta { color: var(--muted); font-size: .88rem; }
.empty { color: var(--muted); padding: 2rem 0; }
.genre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .75rem; }
.genre-card {
  font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c);
  border-radius: .6rem; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .2rem;
}
.genre-card:hover { border-color: var(--c); }
.genre-card:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.genre-card .dot { display: none; }
.gc-name { font-size: 1.2rem; line-height: 1.25; }
.gc-meta { color: var(--muted); font-size: .85rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 class="display">오늘은 뭘 들을까</h1>
  <p class="lede">날씨, 기분, 시간, 하는 일을 고르면 지금 어울리는 음악 장르를 골라드려요.</p>

  <nav class="tabs">
    <a href="#pick" id="tab-pick">추천받기</a>
    <a href="#all" id="tab-all">전체 장르</a>
    <a href="#likes" id="tab-likes">좋아요 목록 <span class="count" id="like-count"></span></a>
  </nav>

  <section id="view-pick">
    <fieldset><legend>바깥 날씨는?</legend><div class="chips" data-key="weather"></div></fieldset>
    <fieldset><legend>지금 기분은?</legend><div class="chips" data-key="mood"></div></fieldset>
    <fieldset><legend>지금 시간대는?</legend><div class="chips" data-key="time"></div></fieldset>
    <fieldset><legend>지금 뭐 하고 있어요?</legend><div class="chips" data-key="act"></div></fieldset>
    <fieldset><legend>취향</legend><div class="chips"><button class="chip" type="button" id="kpop" aria-pressed="false">🇰🇷 케이팝 많이</button></div></fieldset>

    <div class="go">
      <button class="btn" id="pick" disabled>장르 추천받기</button>
      <span class="hint" id="hint"></span>
    </div>

    <section class="result" id="result" aria-live="polite">
      <div class="disc-wrap"><div class="disc" id="disc"></div></div>
      <div>
        <p class="situ" id="situ"></p>
        <div class="genre-row">
          <h2 class="genre display" id="genre"></h2>
          <button class="like" id="like" aria-pressed="false">♡ 좋아요</button>
        </div>
        <p class="reason" id="reason"></p>
        <p class="desc" id="desc"></p>
        <h3>이런 곡부터 들어보세요</h3>
        <ul class="picks" id="picks"></ul>
        <button class="btn ghost small" id="more" style="margin:-.5rem 0 1.25rem">다른 곡 보기</button>
        <div class="search">
          <span>검색해볼 말: <strong id="kw"></strong></span>
          <button class="btn ghost small" id="copy">복사하기</button>
        </div>
        <p class="also" id="also"></p>
        <button class="btn ghost" id="again">다른 장르 보기</button>
      </div>
    </section>
  </section>

  <section id="view-all" hidden>
    <p class="lede">듣고 싶은 장르를 직접 골라보세요.</p>
    <div class="genre-grid" id="genre-grid"></div>
  </section>

  <section id="view-likes" hidden>
    <ul class="likes-list" id="likes-list"></ul>
    <p class="empty" id="likes-empty">아직 좋아요한 장르가 없어요. 추천받기에서 마음에 드는 장르에 ♡를 눌러보세요.</p>
  </section>

  <div class="player" id="player" hidden>
    <div class="player-frame" id="player-frame"></div>
    <div class="player-info">
      <strong id="player-title"></strong>
      <span class="player-msg" id="player-msg"></span>
      <a id="player-yt" target="_blank" rel="noopener">유튜브에서 열기</a>
    </div>
    <button class="btn ghost small" id="player-close" aria-label="플레이어 닫기">닫기</button>
  </div>

  <p class="note">좋아요 목록은 지금 쓰는 브라우저에만 저장돼요. 다른 기기나 다른 브라우저에서는 보이지 않아요.</p>
</main>

const KEYS = ["weather", "mood", "time", "act"];
const LABEL_KEY = { weather: "w", mood: "m", time: "t", act: "a" };
const STORE = "genre-likes-v1";
const state = { kpop: false, weather: null, mood: null, time: null, act: null, current: null, lastName: null };
const $ = id => document.getElementById(id);

/* ---------- 저장소 ---------- */
function loadLikes() {
  try { const v = JSON.parse(localStorage.getItem(STORE)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
let likes = loadLikes();
function saveLikes() {
  try { localStorage.setItem(STORE, JSON.stringify(likes)); } catch (e) {}
  renderLikes();
}

/* ---------- 선택지 ---------- */
document.querySelectorAll(".chips[data-key]").forEach(el => {
  const key = el.dataset.key;
  OPTIONS[key].forEach(item => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = item.label;
    b.dataset.id = item.id; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => select(key, item.id));
    el.appendChild(b);
  });
});
function select(key, id) {
  state[key] = id;
  document.querySelectorAll(`.chips[data-key="${key}"] .chip`)
    .forEach(c => c.setAttribute("aria-pressed", String(c.dataset.id === id)));
  if (key === "weather") tint();
  updateButton();
}
// 지금 시각으로 시간대 미리 골라두기

function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function tint() {
  const w = OPTIONS.weather.find(x => x.id === state.weather);
  if (w) document.body.style.backgroundColor = w.bg[isDark() ? 1 : 0];
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", tint);

function updateButton() {
  const names = { weather: "날씨", mood: "기분", time: "시간대", act: "하는 일" };
  const missing = KEYS.filter(k => !state[k]).map(k => names[k]);
  $("pick").disabled = missing.length > 0;
  $("hint").textContent = missing.length ? `${missing.join(", ")}을(를) 골라주세요.` : "";
}

/* ---------- 추천 ---------- */
function score(g) {
  return (g.w[state.weather] || 0) * 1.0 + (g.m[state.mood] || 0) * 1.3 +
         (g.t[state.time] || 0) * 0.7 + (g.a[state.act] || 0) * 1.1 +
         (state.kpop && g.k ? 2.2 : 0);
}
function ranked() {
  return GENRES.map(g => ({ g, s: score(g) + Math.random() * 0.9 }))
    .sort((a, b) => b.s - a.s).map(x => x.g);
}
function bestReason(g) {
  const weights = { weather: 1.0, mood: 1.3, time: 0.7, act: 1.1 };
  let best = "mood", bestVal = -1;
  KEYS.forEach(k => {
    const v = (g[LABEL_KEY[k]][state[k]] || 0) * weights[k];
    if (v > bestVal) { bestVal = v; best = k; }
  });
  return REASONS[best][state[best]];
}
function ready() { return KEYS.every(k => state[k]); }
function situation() {
  if (!ready()) return "직접 고른 장르";
  const f = k => OPTIONS[k].find(x => x.id === state[k]).adj;
  return `${f("weather")} ${f("time")}, ${f("mood")}으로 ${f("act")}`;
}
function recommend() {
  let list = ranked();
  if (list[0].name === state.lastName) list = [list[1], list[0], ...list.slice(2)];
  state.lastName = list[0].name;
  showGenre(list[0], list.slice(1), false);
}

function showGenre(g, others, manual) {
  state.current = g;
  $("situ").textContent = manual ? "직접 고른 장르" : situation();
  $("genre").textContent = g.name;
  $("reason").textContent = manual ? "" : bestReason(g);
  $("reason").hidden = manual;
  $("desc").textContent = g.desc;
  renderPicks(g);
  $("kw").textContent = g.kw;
  $("copy").textContent = "복사하기";
  $("also").textContent = `이것도 어울려요: ${others[0].name}, ${others[1].name}`;
  document.documentElement.style.setProperty("--label", g.color);
  updateLikeButton();

  const r = $("result");
  r.classList.add("show");
  $("disc").classList.add("spin");
  r.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

function renderPicks(g) {
  const ul = $("picks"); ul.innerHTML = "";
  const shuffle = a => [...a].sort(() => Math.random() - 0.5);
  const gems = g.gems || [];
  const chosen = shuffle(g.picks).slice(0, gems.length ? 3 : 4).map(p => ({ p, gem: false }));
  if (gems.length) chosen.push({ p: shuffle(gems)[0], gem: true });
  chosen.forEach(({ p, gem }) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "song";
    btn.setAttribute("aria-label", `${p} 재생`);
    const icon = document.createElement("span"); icon.className = "play-icon"; icon.textContent = "▶";
    const t = document.createElement("span"); t.textContent = p;
    if (gem) { const b = document.createElement("span"); b.className = "gem"; b.textContent = "숨은 명곡"; t.append(" ", b); }
    btn.append(icon, t);
    btn.addEventListener("click", () => playSong(p));
    li.appendChild(btn); ul.appendChild(li);
  });
  $("more").hidden = g.picks.length + gems.length <= 4;
}

/* ---------- 재생 ---------- */
// 유튜브 API 키를 넣으면 사이트 안에서 바로 재생돼요. 비워두면 유튜브 검색 창이 새로 열려요.
const YT_API_KEY = "";
const ID_CACHE = "genre-video-ids-v1";
function searchQuery(p) { return p.replace("–", "").replace(/[()~]/g, " ").replace(/\s+/g, " ").trim(); }
function searchUrl(p) { return "https://www.youtube.com/results?search_query=" + encodeURIComponent(searchQuery(p)); }
function loadIds() { try { return JSON.parse(localStorage.getItem(ID_CACHE)) || {}; } catch (e) { return {}; } }
function saveId(p, id) { const c = loadIds(); c[p] = id; try { localStorage.setItem(ID_CACHE, JSON.stringify(c)); } catch (e) {} }

async function playSong(p) {
  if (!YT_API_KEY) { window.open(searchUrl(p), "_blank", "noopener"); return; }
  showPlayer(p, null, "불러오는 중…");
  try {
    let id = loadIds()[p];
    if (!id) {
      const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=1&q="
        + encodeURIComponent(searchQuery(p)) + "&key=" + YT_API_KEY;
      const res = await fetch(url);
      if (!res.ok) throw new Error("api");
      const data = await res.json();
      id = data.items && data.items[0] && data.items[0].id.videoId;
      if (!id) throw new Error("none");
      saveId(p, id);
    }
    showPlayer(p, id, "");
  } catch (e) {
    showPlayer(p, null, "여기서 재생할 수 없는 곡이에요. 유튜브에서 열어보세요.");
  }
}
function showPlayer(p, id, msg) {
  $("player").hidden = false;
  document.body.classList.add("has-player");
  $("player-title").textContent = p;
  $("player-msg").textContent = msg;
  $("player-yt").href = searchUrl(p);
  $("player-frame").innerHTML = id
    ? `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" title="${p.replace(/"/g, "&quot;")}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
    : "";
}
function closePlayer() {
  $("player").hidden = true;
  $("player-frame").innerHTML = "";
  document.body.classList.remove("has-player");
}

/* ---------- 좋아요 ---------- */
function isLiked(name) { return likes.some(l => l.name === name); }
function updateLikeButton() {
  const on = state.current && isLiked(state.current.name);
  $("like").setAttribute("aria-pressed", String(!!on));
  $("like").textContent = on ? "♥ 좋아요함" : "♡ 좋아요";
}
$("like").addEventListener("click", () => {
  const g = state.current; if (!g) return;
  if (isLiked(g.name)) likes = likes.filter(l => l.name !== g.name);
  else likes.unshift({ name: g.name, color: g.color, when: situation(), date: new Date().toISOString() });
  saveLikes(); updateLikeButton();
});

function renderLikes() {
  $("like-count").textContent = likes.length ? `♥ ${likes.length}` : "";
  const ul = $("likes-list"); ul.innerHTML = "";
  $("likes-empty").hidden = likes.length > 0;
  likes.forEach(l => {
    const g = GENRES.find(x => x.name === l.name);
    const li = document.createElement("li");
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = l.color;
    const info = document.createElement("div");
    const name = document.createElement("span"); name.className = "name display"; name.textContent = l.name;
    const d = new Date(l.date);
    const meta = document.createElement("span"); meta.className = "meta";
    meta.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 · ${l.when}` + (g ? ` · ${g.picks[0]}` : "");
    info.append(name, meta);
    const del = document.createElement("button");
    del.className = "btn ghost small"; del.textContent = "삭제";
    del.setAttribute("aria-label", `${l.name} 좋아요 삭제`);
    del.addEventListener("click", () => { likes = likes.filter(x => x.name !== l.name); saveLikes(); updateLikeButton(); });
    li.append(dot, info, del);
    ul.appendChild(li);
  });
}

/* ---------- 탭 ---------- */
function route() {
  const view = location.hash === "#likes" ? "likes" : location.hash === "#all" ? "all" : "pick";
  ["pick", "all", "likes"].forEach(v => {
    $("view-" + v).hidden = v !== view;
    if (v === view) $("tab-" + v).setAttribute("aria-current", "page");
    else $("tab-" + v).removeAttribute("aria-current");
  });
  if (view === "likes") renderLikes();
}

function renderGrid() {
  const grid = $("genre-grid");
  GENRES.forEach(g => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "genre-card";
    b.style.setProperty("--c", g.color);
    const n = g.picks.length + (g.gems || []).length;
    b.innerHTML = `<span class="dot"></span><span class="gc-name display"></span><span class="gc-meta">${n}곡</span>`;
    b.querySelector(".gc-name").textContent = g.name;
    b.addEventListener("click", () => {
      state.lastName = g.name;
      location.hash = "#pick";
      showGenre(g, GENRES.filter(x => x !== g).sort(() => Math.random() - 0.5), true);
    });
    grid.appendChild(b);
  });
}
window.addEventListener("hashchange", route);

$("kpop").addEventListener("click", () => {
  state.kpop = !state.kpop;
  $("kpop").setAttribute("aria-pressed", String(state.kpop));
});
$("pick").addEventListener("click", recommend);
$("again").addEventListener("click", () => {
  if (ready()) recommend();
  else {
    const others = GENRES.filter(x => x !== state.current).sort(() => Math.random() - 0.5);
    showGenre(others[0], others.slice(1), true);
  }
});
$("player-close").addEventListener("click", closePlayer);
$("more").addEventListener("click", () => state.current && renderPicks(state.current));
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("kw").textContent); $("copy").textContent = "복사됨"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("kw"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $("copy").textContent = "선택됨, 직접 복사하세요";
  }
});

updateButton(); renderLikes(); renderGrid(); route();
</script>
</body>
</html>
